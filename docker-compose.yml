services:
  meshcore-web:
    image: ghcr.io/entitledosprey/meshcore-web:latest
    container_name: meshcore-web
    restart: unless-stopped
    ports:
      - "8080:8000"
    devices:
      # udev symlink pinned to the radio's USB serial, so a replug or a reboot
      # cannot renumber it away. See the install notes in README.md.
      - "/dev/meshcore:/dev/ttyACM0"
    volumes:
      - meshcore-data:/data
    environment:
      MESH_PORT: /dev/ttyACM0
      MESH_BAUD: "115200"
      MESH_PASSWORD_FILE: /data/passwords.json
      MESH_MESSAGE_FILE: /data/messages.json
      TZ: ${TZ:-Etc/UTC}
      # Telemetry. With INFLUX_URL/INFLUX_TOKEN unset the console runs exactly
      # as before and the collector stays down, so this is safe to deploy
      # before the VLAN rule for 8086 exists.
      INFLUX_URL: ${INFLUX_URL:-}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-meshcore}
      TELEMETRY_SPOOL_DIR: /data/spool
      TELEMETRY_NODE: ${TELEMETRY_NODE:-}
    group_add:
      - "20"   # dialout on Debian/Ubuntu hosts

volumes:
  meshcore-data:
